<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D8B85">
<title>MapTap Pool</title>
<style>
:root{
  --bg:#0A1120;
  --card:#131F35;
  --card-2:#0E1829;
  --line:#233350;
  --cyan:#5CE1F5;
  --teal:#3D8B85;
  --amber:#F5A524;
  --green:#4ADE80;
  --red:#F87171;
  --txt:#EAF2FF;
  --mut:#8493AE;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.4;
  min-height:100dvh;
  padding-bottom:64px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
header{
  background:linear-gradient(160deg,#4C9A93 0%,#3D8B85 55%,#2E6D6A 100%);
  padding:calc(env(safe-area-inset-top) + 20px) 14px 22px;
  text-align:center;
  position:sticky;top:0;z-index:20;
  overflow:hidden;
  isolation:isolate;
}
header .globe{
  position:absolute;left:50%;top:50%;
  width:340px;height:340px;
  transform:translate(-50%,-46%);
  z-index:-1;opacity:.5;pointer-events:none;
}
header .globe .grid{fill:none;stroke:#DFF7F3;stroke-width:1;opacity:.38}
header .globe .rim{fill:none;stroke:#EAFFFB;stroke-width:1.6;opacity:.5}
header .globe .land{fill:#0E3B3C;opacity:.34}
header .globe .glow{fill:url(#gl)}
header .pin{position:absolute;z-index:-1;opacity:.55}
header h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px;color:#fff;text-shadow:0 1px 14px rgba(6,40,40,.5)}
header p{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,.8);text-shadow:0 1px 8px rgba(6,40,40,.45)}

section{margin-top:20px}
.sec-head{
  display:flex;align-items:center;gap:8px;
  margin:0 0 10px;font-size:19px;font-weight:800;letter-spacing:-.3px;
}
.sec-sub{font-size:12px;color:var(--mut);font-weight:500;margin-left:auto}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px;
}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{
  flex:1;border:0;background:transparent;color:var(--mut);
  font:inherit;font-size:14px;font-weight:700;padding:10px 4px;border-radius:9px;cursor:pointer;
}
.tab[aria-selected="true"]{background:rgba(92,225,245,.14);color:var(--cyan)}

/* standings rows */
.row{
  display:flex;align-items:center;gap:12px;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;
}
.row:last-child{margin-bottom:0}
.row.lead{border-color:rgba(92,225,245,.4);background:rgba(92,225,245,.07)}
.rk{font-size:14px;font-weight:800;color:var(--mut);min-width:26px}
.row.lead .rk{color:var(--cyan)}
.nm{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-size:11.5px;font-weight:500;color:var(--mut);margin-top:1px}
.val{font-size:20px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.row.dim .val{color:var(--mut)}

/* records */
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px;display:flex;flex-direction:column;gap:6px;min-height:112px;
}
.rec .badge{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;
  background:var(--card-2);border:1.5px solid var(--line);
}
.rec .lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.rec .big{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rec .who{font-size:12.5px;color:var(--mut);margin-top:-1px}
.rec.gold .badge{border-color:rgba(245,165,36,.55)}
.rec.gold .big{color:var(--amber)}
.rec.cy .badge{border-color:rgba(92,225,245,.45)}
.rec.cy .big{color:var(--cyan)}

/* add score */
label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
select,textarea,input[type=text],input[type=date],input[type=number]{
  width:100%;background:var(--card-2);color:var(--txt);
  border:1px solid var(--line);border-radius:11px;
  font:inherit;font-size:16px;padding:12px;
  -webkit-appearance:none;appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.field{margin-bottom:12px}
.field-hd{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.field-hd label{margin:0}
.hint{font-size:11.5px;color:var(--mut);font-weight:500}
.btn{
  width:100%;border:0;border-radius:12px;font:inherit;font-size:16px;font-weight:800;
  padding:14px;cursor:pointer;background:var(--cyan);color:#03202A;
}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px;padding:11px}
.btn[disabled]{opacity:.45}
.linkish{background:none;border:0;color:var(--cyan);font:inherit;font-size:13.5px;font-weight:600;padding:8px 0;cursor:pointer;text-decoration:underline}
/* date picker block */
.datebox{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:12px}
.datebox .top{display:flex;align-items:center;gap:9px}
.datebox .cal{font-size:17px}
.datebox .dlabel{flex:1;min-width:0}
.datebox .dlabel b{display:block;font-size:15px;font-weight:700}
.datebox .dlabel small{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.datebox .chg{background:none;border:1px solid var(--line);color:var(--cyan);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer}
.quick{display:flex;gap:6px;margin-top:11px}
.quick button{
  flex:1;background:var(--card);border:1px solid var(--line);color:var(--mut);
  font:inherit;font-size:13.5px;font-weight:700;padding:10px 4px;border-radius:9px;cursor:pointer;
}
.quick button[aria-pressed="true"]{background:rgba(92,225,245,.14);border-color:rgba(92,225,245,.45);color:var(--cyan)}
.datebox input[type=date]{margin-top:9px}
.tag{display:inline-block;background:rgba(245,165,36,.16);border:1px solid rgba(245,165,36,.4);color:var(--amber);font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.manual{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.manual input{padding:11px 4px;text-align:center;font-size:15px}
.manual .cap{font-size:10px;color:var(--mut);text-align:center;margin-bottom:4px;font-weight:700}

/* preview / alerts */
.note{border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.note.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);color:#B6F5CE}
.note.warn{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.4);color:#FBD9A0}
.note.bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:#FFC4C4}
.confirm-row{display:flex;gap:8px;margin-top:10px}
.confirm-row .btn{width:auto;flex:1;padding:10px;font-size:14px}
.prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* log */
.day{margin-bottom:14px}
.day-hd{display:flex;align-items:baseline;gap:8px;padding:0 3px 7px}
.day-hd b{font-size:14.5px;font-weight:800}
.day-hd span{font-size:11.5px;color:var(--mut);margin-left:auto}
.log{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;margin-bottom:7px;position:relative;
}
.log.win{border-color:rgba(245,165,36,.45);background:linear-gradient(180deg,rgba(245,165,36,.07),transparent)}
.log-top{display:flex;align-items:center;gap:8px}
.log-top b{font-size:14.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-top .tot{font-size:19px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.log.win .tot{color:var(--amber)}
.rounds{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rd{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{
  flex:0 0 auto;background:var(--card-2);border:1px solid var(--line);color:var(--mut);
  font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;
  line-height:1;white-space:nowrap;
}
.del.confirm{background:rgba(248,113,113,.16);border-color:rgba(248,113,113,.5);color:#FFC4C4}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:26px 12px}
.crown{font-size:13px}
.loading{text-align:center;color:var(--mut);padding:30px;font-size:14px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.row,.log{transition:border-color .15s ease}}
</style>
</head>
<body>

<header>
  <svg class="globe" viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="gl" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#9FF3E8" stop-opacity=".38"/>
        <stop offset="65%" stop-color="#2E6D6A" stop-opacity=".10"/>
        <stop offset="100%" stop-color="#0B2E30" stop-opacity=".30"/>
      </radialGradient>
      <clipPath id="ball"><circle cx="100" cy="100" r="72"/></clipPath>
    </defs>
    <circle class="glow" cx="100" cy="100" r="72"/>
    <g clip-path="url(#ball)">
      <!-- simplified landmasses -->
      <path class="land" d="M42 66 q14-10 26-4 t20 2 q8 8-2 16 t-18 10 q-14 2-22-8 t-4-16z"/>
      <path class="land" d="M74 100 q10 6 8 18 t-6 24 q-6 10-12 2 t-2-22 q2-14 12-22z"/>
      <path class="land" d="M104 62 q16-8 30-2 t18 10 q4 10-8 12 t-26 2 q-14-2-16-10 t2-12z"/>
      <path class="land" d="M112 92 q14 2 18 14 t-2 26 q-6 12-14 6 t-8-24 q0-16 6-22z"/>
      <path class="land" d="M140 132 q14-4 20 4 t-4 14 q-12 6-18-2 t2-16z"/>
      <!-- graticule -->
      <g class="grid">
        <ellipse cx="100" cy="100" rx="72" ry="24"/>
        <ellipse cx="100" cy="100" rx="72" ry="48"/>
        <ellipse cx="100" cy="100" rx="24" ry="72"/>
        <ellipse cx="100" cy="100" rx="48" ry="72"/>
        <line x1="28" y1="100" x2="172" y2="100"/>
        <line x1="100" y1="28" x2="100" y2="172"/>
      </g>
    </g>
    <circle class="rim" cx="100" cy="100" r="72"/>
    <circle cx="66" cy="78" r="3.4" fill="#7CF5C4" opacity=".95"/>
    <circle cx="66" cy="78" r="8" fill="none" stroke="#7CF5C4" stroke-width="1.2" opacity=".45"/>
    <circle cx="134" cy="118" r="2.8" fill="#FFD37A" opacity=".9"/>
  </svg>
  <h1>MapTap Pool</h1>
  <p id="hdr-sub">Daily standings</p>
</header>

<div class="wrap">

  <!-- STANDINGS -->
  <section>
    <h2 class="sec-head">📊 Standings <span class="sec-sub">by avg per game</span></h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-scope="week" aria-selected="true">This week</button>
      <button class="tab" role="tab" data-scope="month" aria-selected="false">This month</button>
      <button class="tab" role="tab" data-scope="all" aria-selected="false">All time</button>
    </div>
    <div id="standings"><div class="loading">Loading…</div></div>
  </section>

  <!-- RECORDS -->
  <section>
    <h2 class="sec-head">🏆 Records</h2>
    <div class="recs" id="records"></div>
  </section>

  <!-- ADD -->
  <section>
    <h2 class="sec-head">➕ Post a score</h2>
    <div class="card">
      <div class="field">
        <label for="player">Player</label>
        <select id="player">
          <option value="">Pick your name</option>
        </select>
      </div>

      <div class="field">
        <div class="field-hd">
          <label>Date played</label>
          <span class="hint">Pasting from MapTap autofills this</span>
        </div>
        <div class="datebox">
          <div class="top">
            <span class="cal" aria-hidden="true">📅</span>
            <span class="dlabel">
              <b id="date-main">Today</b>
              <small id="date-sub"></small>
            </span>
            <button class="chg" id="date-toggle" aria-expanded="false">Change</button>
          </div>
          <div id="date-panel" hidden>
            <div class="quick">
              <button type="button" data-off="0" aria-pressed="true">Today</button>
              <button type="button" data-off="1" aria-pressed="false">Yesterday</button>
              <button type="button" data-off="2" aria-pressed="false">2 days ago</button>
            </div>
            <input type="date" id="entry-date" aria-label="Pick a specific date">
          </div>
        </div>
      </div>

      <div id="paste-mode">
        <div class="field">
          <label for="paste">Paste from MapTap</label>
          <textarea id="paste" placeholder="www.maptap.gg August 7&#10;98🔥 86😁 89🎉 84🌟 82✨&#10;Final score: 860"></textarea>
        </div>
        <div id="parse-out"></div>
        <button class="linkish" id="to-manual">Enter scores manually instead</button>
      </div>

      <div id="manual-mode" hidden>
        <div class="field">
          <label>Round scores <span class="hint">(raw, from the app)</span></label>
          <div class="manual">
            <div><div class="cap">R1</div><input type="number" inputmode="numeric" class="mr" data-r="1"></div>
            <div><div class="cap">R2</div><input type="number" inputmode="numeric" class="mr" data-r="2"></div>
            <div><div class="cap">R3</div><input type="number" inputmode="numeric" class="mr" data-r="3"></div>
            <div><div class="cap">R4</div><input type="number" inputmode="numeric" class="mr" data-r="4"></div>
            <div><div class="cap">R5</div><input type="number" inputmode="numeric" class="mr" data-r="5"></div>
          </div>
        </div>
        <div class="field">
          <div class="field-hd">
            <label for="mfinal">Final score</label>
            <span class="hint">from MapTap, not the round sum</span>
          </div>
          <input type="number" inputmode="numeric" id="mfinal" placeholder="e.g. 879">
        </div>
        <button class="linkish" id="to-paste">Paste from MapTap instead</button>
      </div>

      <button class="btn" id="save" style="margin-top:6px">Save score</button>
      <div id="save-msg" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- LOG -->
  <section>
    <h2 class="sec-head">🗒️ Daily log</h2>
    <div id="log"></div>
  </section>

</div>

<script>
const PLAYERS = ["Evan Browne","Preston Browne","Tanner Nordeen","Sam Ott","Travis Martin"];
const SUPABASE_URL = "https://vvzkuinpbeckbolgouwi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2emt1aW5wYmVja2JvbGdvdXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTA4NjIsImV4cCI6MjEwMTc4Njg2Mn0.jS03n9ufgE77nzTIfo9tpt5lJ4KYFREI4pV_urwUd5g";
const SB_HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};
let entries = [];
let scope = "week";
let mode = "paste";
let selectedDate = null;
let dateFromPaste = false;

/* ---------- storage (Supabase) ---------- */
async function loadEntries(){
  const res = await fetch(SUPABASE_URL+"/rest/v1/entries?select=*", { headers: SB_HEADERS });
  if(!res.ok) throw new Error("load failed: "+res.status);
  return await res.json();
}
async function insertEntryRow(entry){
  const res = await fetch(SUPABASE_URL+"/rest/v1/entries", {
    method: "POST",
    headers: Object.assign({}, SB_HEADERS, { Prefer: "return=minimal" }),
    body: JSON.stringify(entry)
  });
  if(!res.ok) throw new Error("insert failed: "+res.status);
}
async function deleteEntryRow(id){
  const res = await fetch(SUPABASE_URL+"/rest/v1/entries?id=eq."+encodeURIComponent(id), {
    method: "DELETE",
    headers: SB_HEADERS
  });
  if(!res.ok) throw new Error("delete failed: "+res.status);
}

/* ---------- dates ---------- */
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
function iso(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function today(){ return iso(new Date()); }
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const off = (x.getDay()+6)%7;
  x.setDate(x.getDate()-off);
  return x;
}
function daysAgoISO(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return iso(d);
}
function daysBetween(a,b){
  const p = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  return Math.round((p(b)-p(a))/86400000);
}
function relLabel(s){
  const n = daysBetween(s, today());
  if(n === 0) return "Today";
  if(n === 1) return "Yesterday";
  if(n < 0) return "In the future";
  return n+" days ago";
}
function prettyDate(s){
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}

/* ---------- parser ---------- */
function parseShare(text){
  const res = { rounds:[], total:null, date:null, foundDate:false, errors:[] };
  if(!text || !text.trim()){ res.errors.push("Nothing pasted yet."); return res; }
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

  for(const line of lines){
    // final score
    const fs = line.match(/final\s*score\s*[:\-]?\s*([\d,]+)/i);
    if(fs && res.total === null){ res.total = parseInt(fs[1].replace(/,/g,""),10); continue; }

    // date  (e.g. "August 7" or "August 7, 2026")
    if(res.date === null){
      const dm = line.match(new RegExp("("+MONTHS.join("|")+")\\s+(\\d{1,2})(?:\\s*,?\\s*(\\d{4}))?","i"));
      if(dm){
        const mi = MONTHS.indexOf(dm[1].toLowerCase());
        const day = parseInt(dm[2],10);
        let yr = dm[3] ? parseInt(dm[3],10) : new Date().getFullYear();
        let cand = new Date(yr, mi, day);
        if(!dm[3] && cand - new Date() > 1000*60*60*24*45) cand = new Date(yr-1, mi, day);
        res.date = iso(cand);
        res.foundDate = true;
        continue;
      }
    }

    // round line: 4+ number tokens, keeping whatever emoji trails each
    const toks = [...line.matchAll(/(\d{1,3})[ \t]*([^\s\d]*)/g)];
    if(toks.length >= 4 && res.rounds.length === 0){
      res.rounds = toks.map(t => ({ n: parseInt(t[1],10), e: t[2] || "" }));
    }
  }

  if(res.rounds.length === 0) res.errors.push("Couldn't find the round scores line.");
  else if(res.rounds.length !== 5) res.errors.push("Found "+res.rounds.length+" rounds, expected 5.");
  if(res.total === null) res.errors.push("Couldn't find \u201cFinal score\u201d.");
  if(!res.date) res.date = today();

  if(res.rounds.length && res.total !== null){
  // Note: round scores are raw per-round values; MapTap applies hidden
  // multipliers on medium/hard rounds, so they will not sum to Final score.
  // That's expected — Final score is always the source of truth for total.
  }
  return res;
}

/* ---------- stats ---------- */
function inScope(dateStr){
  if(scope === "all") return true;
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const now = new Date();
  if(scope === "week") return dt >= mondayOf(now);
  return dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth();
}

function standings(){
  const map = {};
  PLAYERS.forEach(p => map[p] = { name:p, games:0, pts:0 });
  entries.filter(e => inScope(e.date)).forEach(e => {
    if(!map[e.player]) map[e.player] = { name:e.player, games:0, pts:0 };
    map[e.player].games++;
    map[e.player].pts += e.total;
  });
  return Object.values(map).map(p => ({
    ...p, avg: p.games ? Math.round(p.pts/p.games) : 0
  })).sort((a,b) => b.avg - a.avg || b.games - a.games || a.name.localeCompare(b.name));
}

function dayWinners(){
  const byDate = {};
  entries.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const out = {};
  Object.keys(byDate).forEach(d => {
    const best = Math.max(...byDate[d].map(e => e.total));
    out[d] = byDate[d].filter(e => e.total === best).map(e => e.player);
  });
  return out;
}

function records(){
  const wins = dayWinners();
  const dates = Object.keys(wins).sort();

  // most wins
  const winCount = {};
  dates.forEach(d => wins[d].forEach(p => winCount[p] = (winCount[p]||0)+1));

  // streaks over consecutive logged play-days
  const best = {}, current = {};
  PLAYERS.forEach(p => { best[p] = 0; current[p] = 0; });
  dates.forEach(d => {
    const w = wins[d];
    Object.keys(current).forEach(p => {
      if(w.includes(p)){ current[p]++; if(current[p] > best[p]) best[p] = current[p]; }
      else current[p] = 0;
    });
    w.forEach(p => { if(!(p in current)){ current[p]=1; best[p]=Math.max(best[p]||0,1);} });
  });

  const topDay = entries.slice().sort((a,b) => b.total - a.total)[0] || null;
  const topWins = Object.entries(winCount).sort((a,b)=>b[1]-a[1])[0] || null;
  const topBest = Object.entries(best).sort((a,b)=>b[1]-a[1])[0] || null;
  const topCur  = Object.entries(current).sort((a,b)=>b[1]-a[1])[0] || null;

  return { topDay, topWins, topBest, topCur };
}

/* ---------- render ---------- */
function firstName(n){ return n.split(" ")[0]; }

function renderStandings(){
  const el = document.getElementById("standings");
  const rows = standings();
  const played = rows.filter(r => r.games > 0);
  if(!played.length){
    el.innerHTML = '<div class="card"><div class="empty">No scores logged for this stretch yet. Post one below to get things moving.</div></div>';
    return;
  }
  el.innerHTML = rows.map((r,i) => {
    const rank = r.games ? "#"+(played.findIndex(p=>p.name===r.name)+1) : "—";
    const lead = r.games && played[0].name === r.name;
    return '<div class="row '+(lead?"lead":"")+' '+(r.games?"":"dim")+'">'+
      '<div class="rk">'+rank+'</div>'+
      '<div class="nm">'+r.name+'<small>'+(r.games ? r.games+" game"+(r.games>1?"s":"")+" · "+r.pts.toLocaleString()+" pts" : "no games logged")+'</small></div>'+
      '<div class="val">'+(r.games ? r.avg : "—")+'</div>'+
    '</div>';
  }).join("");
}

function renderRecords(){
  const el = document.getElementById("records");
  const r = records();
  const card = (cls,icon,lbl,big,who) =>
    '<div class="rec '+cls+'"><div class="badge">'+icon+'</div>'+
    '<div class="lbl">'+lbl+'</div>'+
    '<div class="big">'+big+'</div>'+
    '<div class="who">'+who+'</div></div>';

  el.innerHTML = [
    card("gold","🎯","Best single day",
      r.topDay ? r.topDay.total : "—",
      r.topDay ? firstName(r.topDay.player)+" · "+prettyDate(r.topDay.date) : "no scores yet"),
    card("gold","👑","Most daily wins",
      r.topWins ? r.topWins[1] : "—",
      r.topWins ? firstName(r.topWins[0]) : "no scores yet"),
    card("cy","🔥","Longest win streak",
      r.topBest && r.topBest[1] ? r.topBest[1]+"d" : "—",
      r.topBest && r.topBest[1] ? firstName(r.topBest[0]) : "no scores yet"),
    card("cy","⚡","Current streak",
      r.topCur && r.topCur[1] ? r.topCur[1]+"d" : "—",
      r.topCur && r.topCur[1] ? firstName(r.topCur[0]) : "nobody on a run")
  ].join("");
}

function renderLog(){
  const el = document.getElementById("log");
  if(!entries.length){
    el.innerHTML = '<div class="card"><div class="empty">Nothing logged yet. Paste your first MapTap result above.</div></div>';
    return;
  }
  const wins = dayWinners();
  const byDate = {};
  entries.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  const dates = Object.keys(byDate).sort().reverse();

  el.innerHTML = dates.map(d => {
    const list = byDate[d].slice().sort((a,b)=>b.total-a.total);
    return '<div class="day"><div class="day-hd"><b>'+prettyDate(d)+'</b><span>'+list.length+' of '+PLAYERS.length+' in</span></div>'+
      list.map(e => {
        const w = wins[d].includes(e.player);
        return '<div class="log '+(w?"win":"")+'">'+
          '<div class="log-top">'+
            (w?'<span class="crown">👑</span>':'')+
            '<b>'+e.player+'</b>'+
            '<span class="tot">'+e.total+'</span>'+
            '<button class="del" data-id="'+e.id+'" aria-label="Delete entry">✕</button>'+
          '</div>'+
          '<div class="rounds">'+e.rounds.map(rd => '<span class="rd">'+rd.n+(rd.e||"")+'</span>').join("")+'</div>'+
        '</div>';
      }).join("")+
    '</div>';
  }).join("");

  wireDeleteButtons(el);
}

function resetDelButton(b){
  clearTimeout(b._armTimer);
  b.dataset.armed = "0";
  b.textContent = "✕";
  b.classList.remove("confirm");
}

function wireDeleteButtons(scope){
  scope.querySelectorAll(".del").forEach(b => {
    b.addEventListener("click", () => {
      if(b.dataset.armed === "1"){
        resetDelButton(b);
        removeEntry(b.dataset.id);
        return;
      }
      scope.querySelectorAll('.del[data-armed="1"]').forEach(resetDelButton);
      b.dataset.armed = "1";
      b.textContent = "Delete?";
      b.classList.add("confirm");
      b._armTimer = setTimeout(() => resetDelButton(b), 3000);
    });
  });
}

function renderHeader(){
  const t = today();
  const n = entries.filter(e => e.date === t).length;
  document.getElementById("hdr-sub").textContent =
    n ? n+" of "+PLAYERS.length+" posted today" : "Nobody's posted today yet";
}

function renderAll(){ renderHeader(); renderStandings(); renderRecords(); renderLog(); }

/* ---------- date control ---------- */
function setDate(d, fromPaste){
  selectedDate = d;
  dateFromPaste = !!fromPaste;
  renderDate();
}
function renderDate(){
  const rel = relLabel(selectedDate);
  const isToday = selectedDate === today();
  document.getElementById("date-main").innerHTML =
    rel + (dateFromPaste ? '<span class="tag">from paste</span>' : "") +
    (!isToday && !dateFromPaste ? '<span class="tag">backdated</span>' : "");
  document.getElementById("date-sub").textContent = prettyDate(selectedDate);
  document.getElementById("entry-date").value = selectedDate;
  document.querySelectorAll(".quick button").forEach(b => {
    b.setAttribute("aria-pressed", daysAgoISO(+b.dataset.off) === selectedDate ? "true" : "false");
  });
}

/* ---------- parse preview ---------- */
function showParse(){
  const out = document.getElementById("parse-out");
  const raw = document.getElementById("paste").value;
  if(!raw.trim()){ out.innerHTML = ""; return; }
  const p = parseShare(raw);
  if(p.foundDate) setDate(p.date, true);
  const chips = p.rounds.map(r => '<span class="chip">'+r.n+(r.e||"")+'</span>').join("");
  const hard = p.rounds.length === 0 || p.total === null;
  const cls = hard ? "bad" : "ok";
  const msg = hard
    ? p.errors.join(" ")
    : "Saving "+p.total+" for "+prettyDate(p.date)+". Round numbers below are raw scores, MapTap's own multipliers on the harder rounds are already folded into that total.";
  out.innerHTML = '<div class="note '+cls+'">'+msg+
    (p.rounds.length ? '<div class="prev">'+chips+'</div>' : '')+'</div>';
}

/* ---------- save ---------- */
function msg(cls, text){
  document.getElementById("save-msg").innerHTML = '<div class="note '+cls+'">'+text+'</div>';
}

async function saveScore(){
  const player = document.getElementById("player").value;
  if(!player){ msg("bad","Pick your name first."); return; }

  let rounds, total;
  const date = selectedDate;

  if(date > today()){ msg("bad","That date hasn't happened yet. Pick today or earlier."); return; }

  if(mode === "paste"){
    const p = parseShare(document.getElementById("paste").value);
    if(p.rounds.length === 0 || p.total === null){
      msg("bad", p.errors.join(" ")+" Check the paste, or switch to manual entry.");
      return;
    }
    rounds = p.rounds; total = p.total;
  } else {
    const vals = [...document.querySelectorAll(".mr")].map(i => i.value.trim());
    if(vals.some(v => v === "")){ msg("bad","Fill in all five round scores."); return; }
    const nums = vals.map(v => parseInt(v,10));
    if(nums.some(n => isNaN(n) || n < 0)){ msg("bad","Round scores need to be numbers."); return; }
    const finalVal = document.getElementById("mfinal").value.trim();
    if(finalVal === ""){ msg("bad","Enter the final score from MapTap too, it won't match the round sum."); return; }
    total = parseInt(finalVal,10);
    if(isNaN(total) || total < 0){ msg("bad","Final score needs to be a number."); return; }
    rounds = nums.map(n => ({n, e:""}));
  }

  let fresh;
  try{
    fresh = await loadEntries();
  }catch(err){
    msg("bad","Couldn't reach the database. Check your connection and try again.");
    return;
  }
  const dupe = fresh.find(e => e.player === player && e.date === date);
  if(dupe){
    showDupeConfirm(dupe, { player, date, rounds, total });
    return;
  }
  await commitSave({ player, date, rounds, total });
}

function showDupeConfirm(dupe, incoming){
  document.getElementById("save-msg").innerHTML =
    '<div class="note warn">'+dupe.player.split(" ")[0]+' already has '+dupe.total+' logged for '+prettyDate(dupe.date)+
    '. Replace it with '+incoming.total+'?'+
    '<div class="confirm-row">'+
      '<button class="btn ghost" id="dupe-cancel" type="button">Cancel</button>'+
      '<button class="btn" id="dupe-replace" type="button">Replace score</button>'+
    '</div></div>';
  document.getElementById("dupe-cancel").addEventListener("click", () => {
    document.getElementById("save-msg").innerHTML = "";
  });
  document.getElementById("dupe-replace").addEventListener("click", async () => {
    try{
      await deleteEntryRow(dupe.id);
    }catch(err){
      msg("bad","Couldn't remove the old score. Try again.");
      return;
    }
    await commitSave(incoming);
  });
}

async function commitSave({ player, date, rounds, total }){
  const btn = document.getElementById("save");
  btn.disabled = true; btn.textContent = "Saving…";
  try{
    const id = Date.now()+"-"+Math.random().toString(36).slice(2,7);
    await insertEntryRow({ id, player, date, total, rounds });
    entries = await loadEntries();
    renderAll();
    document.getElementById("paste").value = "";
    document.getElementById("parse-out").innerHTML = "";
    document.querySelectorAll(".mr").forEach(i => i.value = "");
    document.getElementById("mfinal").value = "";
    dateFromPaste = false; renderDate();
    msg("ok", total+" logged for "+player.split(" ")[0]+" on "+prettyDate(date)+
      ". Backdating more? Change the date and paste the next one.");
  }catch(err){
    msg("bad","Couldn't save that. Check your connection and try again.");
  }
  btn.disabled = false; btn.textContent = "Save score";
}

async function removeEntry(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  try{
    await deleteEntryRow(id);
    entries = await loadEntries();
    renderAll();
  }catch(err){
    const btn = document.querySelector('.del[data-id="'+id+'"]');
    if(btn){ btn.textContent = "!"; setTimeout(() => resetDelButton(btn), 1600); }
  }
}

/* ---------- wiring ---------- */
function init(){
  const sel = document.getElementById("player");
  PLAYERS.forEach(p => {
    const o = document.createElement("option");
    o.value = p; o.textContent = p; sel.appendChild(o);
  });
  const di = document.getElementById("entry-date");
  di.max = today();
  selectedDate = today();
  renderDate();

  document.getElementById("date-toggle").addEventListener("click", e => {
    const panel = document.getElementById("date-panel");
    const open = panel.hidden;
    panel.hidden = !open;
    e.target.setAttribute("aria-expanded", String(open));
    e.target.textContent = open ? "Done" : "Change";
  });
  document.querySelectorAll(".quick button").forEach(b => {
    b.addEventListener("click", () => setDate(daysAgoISO(+b.dataset.off), false));
  });
  di.addEventListener("change", () => { if(di.value) setDate(di.value, false); });

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected","false"));
    t.setAttribute("aria-selected","true");
    scope = t.dataset.scope;
    renderStandings();
  }));

  document.getElementById("paste").addEventListener("input", showParse);
  document.getElementById("save").addEventListener("click", saveScore);

  document.getElementById("to-manual").addEventListener("click", () => {
    mode = "manual";
    document.getElementById("paste-mode").hidden = true;
    document.getElementById("manual-mode").hidden = false;
    document.getElementById("save-msg").innerHTML = "";
    document.getElementById("parse-out").innerHTML = "";
    dateFromPaste = false; renderDate();
  });
  document.getElementById("to-paste").addEventListener("click", () => {
    mode = "paste";
    document.getElementById("manual-mode").hidden = true;
    document.getElementById("paste-mode").hidden = false;
    document.getElementById("save-msg").innerHTML = "";
  });
}

(async function(){
  init();
  try{
    entries = await loadEntries();
  }catch(e){ entries = []; }
  renderAll();
})();
</script>
